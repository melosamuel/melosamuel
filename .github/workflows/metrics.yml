name: GitHub Metrics

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Main Stats & Traffic
        uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: melosamuel
          template: classic
          base: header, activity, community, repositories, metadata
          plugin_traffic: yes
      - name: AniList Status
        uses: lowlighter/metrics@latest
        with:
          filename: anilist-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          user: melosamuel
          base: ""
          plugin_anilist: yes
          plugin_anilist_user: SrKrauss
          plugin_anilist_medias: anime
          plugin_anilist_sections: watching, completed, planning
