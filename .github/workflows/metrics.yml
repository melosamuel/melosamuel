name: GitHub Metrics

on:
  schedule: [{cron: "0 0 * * *"}]
  workflow_dispatch:
  push: {branches: ["master", "main"]}

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          user: melosamuel
          template: classic
          base: header, activity, community, repositories, metadata
          # Trafic
          plugin_traffic: yes
          # Anilist
          plugin_anilist: yes
          plugin_anilist_user: SrKrauss
          plugin_anilist_medias: anime
          plugin_anilist_sections: watching, completed, planning
          plugin_anilist_limit: 2
